[package]
name = "qubit-measure"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-measure"
description = "Persistent typed Decimal measurements with explicit units and optional uom adapters"
homepage = "https://github.com/qubit-ltd/rs-measure"
documentation = "https://docs.rs/qubit-measure"
readme = "README.md"
keywords = ["measurement", "units", "uom", "quantity", "qubit"]
categories = ["data-structures", "science"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/examples/**",
    "/fixtures/**",
    "/tests/**",
    "/benches/**",
]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
uom = ["dep:uom"]

[lib]
name = "qubit_measure"

[[example]]
name = "uom_bridge"
required-features = ["uom"]

[[bench]]
name = "conversion_and_parsing"
harness = false

[dependencies]
num-bigint-04 = { package = "num-bigint", version = "0.4" }
num-rational = "0.4"
rust_decimal = { version = "1.42", features = ["serde-with-str"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uom = { version = "0.38", optional = true, default-features = false, features = ["f64", "si", "std"] }

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"
rust_decimal = { version = "1.42", features = ["macros"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
